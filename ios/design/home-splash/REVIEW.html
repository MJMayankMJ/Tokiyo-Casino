<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokiyo · Home & launch</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#edeff1;background:#101214}body{margin:0;padding:32px;max-width:1000px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:24px;margin:0}p{color:#ced1d5;font-size:14px;line-height:1.6}nav{display:flex;gap:8px}button{border:1px solid #3b3d40;border-radius:20px;padding:10px 18px;color:inherit;background:#222427;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#79dd9f;color:#0c2416;border-color:#79dd9f}main{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}figure{margin:0}figcaption{font-size:13px;color:#ced1d5;margin-bottom:12px}img{display:block;width:100%;border-radius:24px;border:1px solid #3b3d40}a{color:#79dd9f}@media(max-width:560px){body{padding:20px}header{display:block}nav{margin-top:16px}main{gap:12px}img{border-radius:14px}}

<header><div><h1>tokiyo <span style="font-weight:400;color:#898c91">/ home & launch</span></h1><p>532’s palette. Familiar characters. A quieter place to play.</p></div><nav aria-label="Appearance"><button aria-pressed="true" onclick="theme('dark')">Dark</button><button aria-pressed="false" onclick="theme('light')">Light</button></nav></header>
<main><figure><figcaption>01 · HOME</figcaption><img id="home" src="previews/home-dark.png" alt="Tokiyo home in dark mode, with Poker and 5-3-2 character buttons"></figure><figure><figcaption>02 · LAUNCH</figcaption><img id="splash" src="previews/splash-dark.png" alt="Tokiyo launch screen in dark mode, with the new card and sparkle mark"></figure></main>
<p>Actual UIKit renders · <a href="HANDOFF.md">Design handoff</a> · <a href="ART-PROMPTS.md">Character assets & prompts</a></p>
<script>function theme(mode){for(const id of ['home','splash']){const el=document.getElementById(id);el.src='previews/'+id+'-'+mode+'.png';el.alt='Tokiyo '+id+' in '+mode+' mode'}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent.toLowerCase()===mode)))}</script></html>
